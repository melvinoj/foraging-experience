<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Foraging Experience — Gresgen</title>
<link rel="canonical" href="https://melvinoj.github.io/foraging-experience/">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<style>
/* ════ App styles — copied from the app at build time (app_styles.py) ════ */
/* ── frontend/static/css/tokens.css :root (verbatim) ── */
:root {
  /* Colour */
  --ink:         #1E2A22;
  --ground:      #EEF0EA;
  --paper:       #FDFDFB;
  --moss:        #5A6B58;
  --moss-light:  #8A9884;
  --leaf:        #7E9471;
  --leaf-pale:   #C9D2BC;
  --hairline:    #D8DCD2;
  --damson:      #5B3A4E;
  --amber:       #C89B3C;
  --water:       #6E8FA8;
  --alert:       #B0524A;

  /* Type */
  --font-display: Georgia, 'Times New Roman', serif;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

  /* Layout */
  --touch-min: 44px;
}
/* ── app shell colours: species.html body {'background': '#2a3330', 'color': '#d8e4d8'}, lists.html body {'background': '#1e2b28', 'color': '#d8e4d8'} ── */
:root { --app-shell:#2a3330; --app-shell-deep:#1e2b28; --app-text:#d8e4d8; --app-toxic:#dc2626; --app-forest:#2d5016; --app-heading:#8ab87a; }
/* index.html */
.walk-stop-card {
      background: #f8fdf4; border: 1px solid #d8e8c8;
      border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    }
/* index.html */
.walk-stop-num {
      display: inline-block; width: 22px; height: 22px;
      background: #2d5016; color: white; border-radius: 50%;
      font-size: 0.7rem; font-weight: 700;
      text-align: center; line-height: 22px;
      margin-right: 7px; flex-shrink: 0; vertical-align: middle;
    }
/* index.html */
.walk-stop-species { font-size: 0.82rem; font-weight: 600; color: #2d5016; }
/* index.html */
.walk-stop-common  { font-size: 0.75rem; color: #666; margin-top: 2px; }
/* index.html */
.walk-stop-meta    { font-size: 0.72rem; color: #999; margin-top: 2px; }
/* index.html */
.walk-stop-recipe  {
      margin-top: 6px; padding: 5px 8px;
      background: #fffbe6; border-left: 3px solid #e5a800;
      border-radius: 0 4px 4px 0; font-size: 0.73rem; color: #6b5200;
    }
/* index.html */
.walk-stop-recipe strong { color: #e5a800; }
/* index.html */
.walk-header h3 { font-size: 0.9rem; color: #2d5016; margin-bottom: 2px; }
/* index.html */
.walk-header .walk-sub { font-size: 0.75rem; color: #888; }
/* species.html */
.species-card {
      background: #344440; border: 1px solid #4a5e5a; border-radius: 8px;
      padding: 14px; cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s;
      text-decoration: none; color: inherit; display: block;
    }
/* species.html */
.species-card .common { font-size: 0.95rem; font-weight: 700; color: #a8c88a; margin-bottom: 2px; }
/* species.html */
.species-card .sci-name { font-size: 0.78rem; font-weight: 400; font-style: italic; color: #5a7a3a; }
/* species.html */
.species-card .common-de { font-size: 0.75rem; color: #7a6530; font-style: italic; margin-top: 1px; }
/* species.html */
.species-card .family { font-size: 0.75rem; color: #888; margin-top: 4px; }
/* species.html */
.species-card .warn-badge {
      display: inline-block; margin-top: 6px; margin-left: 4px;
      background: #f8d7da; color: #842029; font-size: 0.72rem;
      padding: 2px 7px; border-radius: 10px;
    }
/* species.html */
.species-card .toxic-badge {
      display: inline-block; margin-top: 6px; margin-left: 4px;
      background: #dc2626; color: #fff; font-size: 0.72rem;
      padding: 2px 7px; border-radius: 10px; font-weight: 600;
    }
/* species.html */
#list-view h2 { font-size: 1.3rem; color: #8ab87a; margin-bottom: 4px; }
/* species.html */
#list-view .subtitle { font-size: 0.85rem; color: #7a9a7a; margin-bottom: 16px; }

/* Edibility badges — colours read from index.html renderWalkPanel() at build time */
.badge { display:inline-block; font-size:0.68rem; padding:1px 6px; border-radius:4px;
  font-weight:600; background:#f3f3f3; color:#555; }
.badge.toxic, .badge.deadly { background:#dc2626; color:#fff; font-weight:700; }
.badge.edible   { background:#d1f5da; color:#166534; }
.badge.inedible { background:#fef3c7; color:#854d0e; }
/* Apiaceae ID card: species.html .warn-badge colours */
.badge.apiaceae { background:#f8d7da; color:#842029; font-weight:700; }
/* caution: the walk panel has no caution colour — use the app's --amber token */
.badge.caution  { background:var(--amber); color:var(--ink); }


/* ════ Page layout — composes the app's tokens and classes ════ */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--app-shell); color: var(--app-text); font-family: var(--font-ui);
    line-height: 1.45; overflow-x: hidden; }
  /* Page images only — never Leaflet's tiles/markers (Leaflet sizes those itself). */
  img:not(.leaflet-container img) { max-width: 100%; display: block; }
  a { color: var(--leaf-pale); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

  header.hero { background: var(--app-shell-deep); padding: 26px 0 20px; border-bottom: 2px solid var(--app-forest); }
  .hero h1 { font-family: var(--font-display); font-weight: 400; color: var(--app-heading);
    font-size: clamp(1.5rem, 5vw, 2.1rem); line-height: 1.2; margin: 0 0 8px; }
  .hero p { margin: 0 0 12px; max-width: 62ch; }
  .meta { font-size: 0.8rem; color: var(--moss-light); margin-bottom: 16px; }
  .cta { display: inline-flex; align-items: center; min-height: var(--touch-min); padding: 0 20px;
    background: var(--app-forest); color: var(--paper); border-radius: 7px; font-weight: 600;
    text-decoration: none; border: 1.5px solid var(--leaf); }
  .cta:hover { background: var(--moss); }

  nav.tabs { position: sticky; top: 0; z-index: 1000; background: var(--app-shell-deep);
    border-bottom: 1px solid rgba(255,255,255,.08); }
  .tabs .wrap { display: flex; }
  .tab { flex: 1; min-height: var(--touch-min); appearance: none; border: 0; background: none;
    font: 600 0.9rem var(--font-ui); color: var(--moss-light); border-bottom: 3px solid transparent; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--leaf-pale); border-bottom-color: var(--leaf); }

  section.panel { padding: 18px 0 28px; }
  section.panel[hidden] { display: none; }
  #list-view h2 { font-family: var(--font-display); font-weight: 400; }

  /* Square corners on purpose: border-radius + Leaflet's overflow:hidden makes Chrome
     composite the tile layer as a clipped layer, a known source of hairline tile seams. */
  #map { height: 58vh; min-height: 300px; border: 1px solid rgba(255,255,255,.12); }
  /* Leaflet's default container colour is #ddd; any hairline gap between tiles
     (fractional-pixel tile positions) shows that through as a near-white grid line.
     Dark here so a gap, if any, matches the page instead. */
  .leaflet-container { background: var(--app-shell-deep); }
  .leaflet-container img { box-sizing: content-box; }
  /* Tile seams: on this page the map sits at a fractional pixel position (58vh height,
     text above with non-integer line heights), so 256px tiles can leave hairline gaps
     that show the container colour (seen as dark lines, 15 Oct 2026). Fix: overlap
     each tile by half a pixel so no gap can open. Leaflet 1.9.4's plus-lighter blending
     would ADD colours in that overlap (a bright line), so tiles use normal blending —
     the overlap simply covers. */
  .leaflet-container img.leaflet-tile { mix-blend-mode: normal;
    width: 256.5px !important; height: 256.5px !important; }
  .stop-pin { width: 26px; height: 26px; border-radius: 50%; background: var(--app-forest); color: #fff;
    font: 700 12px/26px var(--font-ui); text-align: center; border: 2px solid var(--paper);
    box-shadow: 0 1px 4px rgba(0,0,0,.4); }

  .stops { margin-top: 16px; }
  .stop-head { display: flex; align-items: center; gap: 2px; cursor: pointer; min-height: 28px;
    color: var(--ink); font-size: 0.8rem; font-weight: 600; }
  .stop-head .badge { margin-left: 6px; }
  .walk-stop-sp { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; }
  .walk-stop-sp + .walk-stop-sp { border-top: 1px dashed #e3ead7; padding-top: 8px; }
  .walk-stop-sp img, .walk-stop-sp .noimg { width: 52px; height: 52px; border-radius: 6px; object-fit: cover;
    flex: 0 0 auto; background: var(--leaf-pale); }
  .walk-stop-species { font-family: var(--font-display); font-style: italic; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 4px; }
  .chip { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid rgba(255,255,255,.18);
    background: transparent; color: var(--leaf-pale); font: 600 .82rem var(--font-ui); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--app-forest); border-color: var(--leaf); color: var(--paper); }
  .species-card.pick { cursor: pointer; }
  .species-card.pick:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; }
  .species-card[hidden] { display: none; }

  body.sp-open { overflow: hidden; }
  .sp-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 1500; }
  .sp-panel { position: fixed; z-index: 1600; left: 0; right: 0; bottom: 0; max-height: 90vh; overflow-y: auto;
    background: var(--app-shell); border-top: 2px solid var(--app-forest); border-radius: 14px 14px 0 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,.4); padding: 0 0 20px; }
  .sp-panel[hidden], .sp-scrim[hidden] { display: none; }
  @media (min-width: 760px) {
    .sp-panel { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%);
      width: min(640px, 92vw); max-height: 88vh; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); }
  }
  .sp-close { position: sticky; top: 8px; float: right; margin: 8px 8px -52px 0; z-index: 2;
    width: var(--touch-min); height: var(--touch-min); border-radius: 50%; border: 0;
    background: rgba(30,43,40,.85); color: var(--paper); font-size: 1.1rem; cursor: pointer; }
  .sp-main { width: 100%; max-height: 52vh; object-fit: cover; cursor: zoom-in; background: var(--app-shell-deep); }
  .sp-thumbs { display: flex; gap: 8px; padding: 10px 16px 0; overflow-x: auto; }
  .sp-thumb { flex: 0 0 auto; width: 64px; height: 64px; padding: 0; border: 2px solid transparent; border-radius: 6px;
    background: none; cursor: pointer; overflow: hidden; }
  .sp-thumb.on { border-color: var(--leaf); }
  .sp-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .sp-text.species-card { background: none; border: 0; padding: 12px 16px 0; cursor: default; }
  .sp-text .common { font-size: 1.3rem; }
  .sp-text .badge { margin-top: 8px; }

  #tree-frame-wrap { height: 70vh; min-height: 360px; border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.12); background: var(--app-shell-deep); }
  #tree-frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); margin-top: 16px; }
  .grid .species-card { padding: 0; overflow: hidden; cursor: default; }
  .grid .species-card.toxic { border: 2px solid var(--app-toxic); }
  .species-card .photo { aspect-ratio: 4 / 3; width: 100%; object-fit: cover; background: var(--app-shell-deep); cursor: zoom-in; }
  .species-card .body { padding: 12px 14px 14px; }
  .species-card .common { font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; }
  .species-card .badge { margin-top: 6px; }
  .warn { margin-top: 8px; font-size: 0.8rem; border-radius: 0 6px 6px 0; padding: 7px 9px; line-height: 1.4; }
  .warn.toxic { background: rgba(220,38,38,.14); color: #fecaca; border-left: 3px solid var(--app-toxic); }
  .warn.lookalike { background: rgba(200,155,60,.14); color: #f3e2bb; border-left: 3px solid var(--amber); }
  .warn strong { display: block; margin-bottom: 2px; }
  .species-card .walk-stop-recipe { margin: 8px 0 0; }
  .walk-stop-recipe .line { margin-top: 3px; font-style: italic; line-height: 1.4; }
  .note-box { background: var(--app-shell-deep); border-left: 3px solid var(--amber); border-radius: 0 6px 6px 0;
    padding: 9px 12px; color: var(--leaf-pale); font-weight: 600; margin: 0; }

  footer { background: var(--app-shell-deep); border-top: 2px solid var(--app-forest); padding: 22px 0 36px;
    font-size: 0.8rem; color: var(--moss-light); }
  footer h2 { font-family: var(--font-display); font-weight: 400; font-size: 1rem; color: var(--app-heading); margin: 0 0 8px; }
  footer p { margin: 0 0 10px; }
  .footer-links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; }
  .footer-links a { display: inline-flex; align-items: center; min-height: var(--touch-min); }
  .placeholder { color: var(--alert); font-weight: 700; }

  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 2000; display: none;
    align-items: center; justify-content: center; padding: 16px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-height: 90vh; border-radius: 8px; }
  .leaflet-popup-content { margin: 10px 12px; min-width: 210px; font-family: var(--font-ui); }
  .locate-btn { width: var(--touch-min); height: var(--touch-min); border-radius: 6px; border: 2px solid rgba(0,0,0,.2);
    background: var(--paper); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; }
  .locate-btn:disabled { opacity: .5; }
  .leaflet-control-layers { font-family: var(--font-ui); }
  .leaflet-popup-content .walk-stop-sp:first-of-type { margin-top: 4px; }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1 id="title"></h1>
    <p id="intro"></p>
    <div class="meta" id="meta"></div>
    <a class="cta" id="cta" href="#" target="_top" rel="noopener"></a>
  </div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" id="tab-walk" aria-controls="panel-walk" aria-selected="true">Walk</button>
    <button class="tab" role="tab" id="tab-plants" aria-controls="panel-plants" aria-selected="false">Plants</button>
    <button class="tab" role="tab" id="tab-recipes" aria-controls="panel-recipes" aria-selected="false">Recipes</button>
    <button class="tab" role="tab" id="tab-taxonomy" aria-controls="panel-taxonomy" aria-selected="false">Taxonomy</button>
  </div>
</nav>

<main id="list-view">
  <section class="panel" id="panel-walk" role="tabpanel" aria-labelledby="tab-walk">
    <div class="wrap">
      <h2>The route</h2>
      <p class="subtitle">Numbered stops follow the walk.</p>
      <div id="map" role="region" aria-label="Walk map"></div>
      <div class="stops walk-stops" id="stops"></div>
    </div>
  </section>

  <section class="panel" id="panel-plants" role="tabpanel" aria-labelledby="tab-plants" hidden>
    <div class="wrap">
      <h2>Plants on this walk</h2>
      <p class="subtitle">Tap a plant for more photos and details.</p>
      <div class="chips" role="group" aria-label="Filter plants">
        <button class="chip" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" data-filter="edible" aria-pressed="false">Edible</button>
        <button class="chip" data-filter="caution" aria-pressed="false">Caution</button>
        <button class="chip" data-filter="toxic" aria-pressed="false">☠ Toxic</button>
      </div>
      <div class="grid" id="species-grid"></div>
    </div>
  </section>

  <section class="panel" id="panel-recipes" role="tabpanel" aria-labelledby="tab-recipes" hidden>
    <div class="wrap">
      <h2>From the walk to the plate</h2>
      <p class="note-box">A taste of what we cook — full recipes on the day.</p>
      <div class="grid" id="recipe-grid"></div>
    </div>
  </section>

  <section class="panel" id="panel-taxonomy" role="tabpanel" aria-labelledby="tab-taxonomy" hidden>
    <div class="wrap">
      <h2>Family tree</h2>
      <p class="subtitle">How everything we meet on the way is related. Tap a branch to open it, tap a species for its photo.</p>
      <div id="tree-frame-wrap"></div>
    </div>
  </section>
</main>

<div class="sp-scrim" id="sp-scrim" hidden></div>
<div class="sp-panel" id="sp-panel" role="dialog" aria-modal="true" aria-labelledby="sp-panel-title" hidden>
  <button class="sp-close" id="sp-close" aria-label="Close">✕</button>
  <div id="sp-panel-body"></div>
</div>

<footer>
  <div class="wrap">
    <h2 id="disclaimer-h"></h2>
    <div id="disclaimer"></div>
    <div class="footer-links" id="footer-links"></div>
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-label="Photo"><img alt=""></div>

Mead Syllabub with Roasted Stone Fruit and Honey", "line": "The flowers have a long history in mead-making, and it's that relationship — botanical bitterness meeting fermented sweetness — that this recipe follows.", "source": "ai_generated"}, {"recipe_id": 49, "species_id": 286, "dish": "Dandelion Leaf Salad with Roasted Root Dressing, Caper-Preserved Buds, and a Warm Anchovy and Wild Garlic Fat", "line": "Dandelion is one of those plants that rewards patience and understanding — treat it carelessly and it bites back with bitterness; treat it with respect and it gives you something genuinely…", "source": "ai_generated"}, {"recipe_id": 74, "species_id": 329, "dish": "Spring Beech Leaf Salad with Toasted Beechnut, Aged Sheep's Cheese & Wild Herb Dressing", "line": "There's a window of maybe three weeks in spring when beech does something quietly extraordinary — those translucent copper-green leaves unfurl with a softness and a delicate nuttiness…", "source": "ai_generated"}, {"recipe_id": 83, "species_id": 341, "dish": "Malva moschata with Labneh, Preserved Lemon & Toasted Seed", "line": "Musk mallow doesn't shout.", "source": "ai_generated"}, {"recipe_id": 60, "species_id": 343, "dish": "Grand Fir Shoot Tea with Honey, Lemon, and Wild Ferment Shrub", "line": "The young spring tips of grand fir carry something you don't forget — a clean, resinous brightness that sits somewhere between citrus zest, pine, and cold mountain air.", "source": "ai_generated"}, {"recipe_id": 122, "species_id": 359, "dish": "Silver Fir Bark & Rye Bread Porridge with Fermented Fir Tip Vinegar", "line": "The inner bark of Abies alba carries a quiet, woody sweetness with something almost like toasted oats underneath—a soft, resinous warmth that asks for slow cooking, not flour blending into…", "source": "ai_generated"}, {"recipe_id": 137, "species_id": 361, "dish": "Campanula Rotundifolia Harebell Salad with Smoked Ewe's Milk Cheese and Charred Wild Garlic Dressing", "line": "The delicate harebell leaves mingle with the pungent charred wild garlic, creating a symphony of tastes rooted in our rich culinary heritage.", "source": "ai_generated"}, {"recipe_id": 130, "species_id": 420, "dish": "Betula Pendula Birch Syrup Sorbet with Saffron Poached Pears and a Hint of Anise", "line": "Today, we shall dance an ode to this humble tree in the form of a refreshing sorbet, accompanied by saffron-kissed pears and a whisper of anise.", "source": "ai_generated"}, {"recipe_id": 136, "species_id": 515, "dish": "Shepherd's Purse Greens with Sesame & Zanzibari Spices", "line": "A vibrant, peppery green that carries the essence of spring, our humble Shepherd's Purse is transformed into a symphony of flavours in this delightful recipe.", "source": "ai_generated"}, {"recipe_id": 154, "species_id": 701, "dish": "Fried Wild Herb, Polenta & Quinoa Fingers with Mountain Cheese", "line": "Toast whole quinoa in a dry pan until nutty and golden, cool, then grind.", "source": "Friture Sauvage menu, Hofgut LEO, 5 July 2026"}], "disclaimer": {"heading": "A note on safety and sources", "paras": ["Edibility and medicinal information on this page is for educational reference only. Always verify identification with multiple authoritative sources before consuming any wild plant or fungi. Never rely on any single source, including this page, as your sole basis for a consumption decision. Identification and content may be AI-assisted. Human-created and/or reviewed content is indicated where shown. This page is an educational resource, not a safety-certified identification system."]}};
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script>
(function () {
  "use strict";
  var D = window.DATA;
  var byId = {};
  D.species.forEach(function (s) { byId[s.id] = s; });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function badge(s) { return '<span class="badge ' + esc(s.badge.kind) + '">' + esc(s.badge.text) + "</span>"; }
  function img(src, alt) {
    return src ? '<img src="' + esc(src) + '" alt="' + esc(alt) + '" loading="lazy">' : '<div class="noimg"></div>';
  }
  // Same order as the app's walk panel: scientific name, common name, then the badge.
  function stopSpecies(s) {
    var common = [s.en, s.de].filter(Boolean).join(" · ");
    return '<div class="walk-stop-sp">' + img(s.thumb, s.en || s.sci) + "<div>" +
      '<span class="walk-stop-species">' + esc(s.sci) + "</span>" +
      (common ? '<div class="walk-stop-common">' + esc(common) + "</div>" : "") +
      '<div class="walk-stop-meta">' + badge(s) + "</div></div></div>";
  }

  // ── header ──
  document.title = D.title;
  document.getElementById("title").textContent = D.title;
  document.getElementById("intro").textContent = D.intro;
  var km = D.walk.distance_m ? (D.walk.distance_m / 1000).toFixed(1) + " km" : "";
  var hrs = D.walk.duration_min ? "about " + (Math.round(D.walk.duration_min / 30) / 2) + " h walking" : "";
  document.getElementById("meta").textContent =
    [km, hrs, D.walk.stops.length + " stops", D.species.length + " species"].filter(Boolean).join(" · ");
  var cta = document.getElementById("cta");
  cta.textContent = D.cta_label; cta.href = D.contact_url;

  // ── tabs ──
  var tabs = ["walk", "plants", "recipes", "taxonomy"];
  var treeLoaded = false, map = null;
  function show(name) {
    if (tabs.indexOf(name) < 0) name = "walk";
    tabs.forEach(function (t) {
      document.getElementById("tab-" + t).setAttribute("aria-selected", t === name ? "true" : "false");
      document.getElementById("panel-" + t).hidden = t !== name;
    });
    if (name === "taxonomy" && !treeLoaded) {
      // Created on first open so the tree lays out at its real size.
      var f = document.createElement("iframe");
      f.src = "tree.html"; f.title = "Plant family tree";
      document.getElementById("tree-frame-wrap").appendChild(f);
      treeLoaded = true;
    }
    if (name === "walk" && map) setTimeout(function () { map.invalidateSize(); }, 0);
    if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  }
  tabs.forEach(function (t) {
    document.getElementById("tab-" + t).addEventListener("click", function () { show(t); });
  });

  // ── walk: stop cards in the app's walk-panel layout ──
  var stopsEl = document.getElementById("stops");
  stopsEl.innerHTML = D.walk.stops.map(function (st) {
    // Plain numbered stop; toxicity is shown only on the plant (its badge).
    return '<div class="walk-stop-card" id="stop-' + st.n + '">' +
      '<div class="stop-head" data-stop="' + st.n + '"><span class="walk-stop-num">' + st.n + "</span>" +
      (st.species.length > 1 ? st.species.length + " species here" : "Stop " + st.n) + "</div>" +
      st.species.map(function (id) { return stopSpecies(byId[id]); }).join("") + "</div>";
  }).join("");

  var markers = {};
  if (window.L) {
    map = L.map("map", { scrollWheelZoom: false });
    // Same keyless base layers as the app (frontend/index.html _baseLayers). No API keys.
    var base = {
      "Standard": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '© <a href="https://openstreetmap.org/copyright" target="_top">OpenStreetMap</a> contributors', maxZoom: 19 }),
      "Satellite": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Tiles &copy; Esri &mdash; Source: Esri, USGS, AeroGRID, IGN, and the GIS User Community", maxZoom: 19 }),
      "Topo": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
        attribution: 'Map data: &copy; <a href="https://openstreetmap.org/copyright" target="_top">OpenStreetMap</a> contributors, SRTM | Display: &copy; <a href="https://opentopomap.org" target="_top">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_top">CC-BY-SA</a>)',
        maxZoom: 17, subdomains: ["a", "b", "c"] })
    };
    base["Standard"].addTo(map);
    L.control.layers(base, null, { position: "topright", collapsed: true }).addTo(map);

    // Locate me — browser geolocation, shown on the map only. Nothing is stored or sent.
    var here = null;
    var Locate = L.Control.extend({
      options: { position: "topleft" },
      onAdd: function () {
        var b = L.DomUtil.create("button", "locate-btn");
        b.type = "button"; b.title = "Show my location"; b.setAttribute("aria-label", "Show my location");
        b.textContent = "◎";
        L.DomEvent.disableClickPropagation(b);
        L.DomEvent.on(b, "click", function () {
          if (!navigator.geolocation) { alert("Location isn't available in this browser."); return; }
          b.disabled = true;
          navigator.geolocation.getCurrentPosition(function (pos) {
            b.disabled = false;
            var ll = [pos.coords.latitude, pos.coords.longitude];
            if (here) here.remove();
            here = L.layerGroup([
              L.circle(ll, { radius: pos.coords.accuracy, color: "#6E8FA8", weight: 1, fillOpacity: 0.12 }),
              L.circleMarker(ll, { radius: 7, color: "#fff", weight: 2, fillColor: "#6E8FA8", fillOpacity: 1 })
            ]).addTo(map);
            map.setView(ll, Math.max(map.getZoom(), 15));
          }, function (err) {
            b.disabled = false;
            alert(err.code === 1 ? "Location permission was refused." : "Couldn't get your location.");
          }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
        });
        return b;
      }
    });
    map.addControl(new Locate());
    var bounds = [];
    if (D.walk.line) {
      var ll = D.walk.line.map(function (c) { return [c[1], c[0]]; });
      L.polyline(ll, { color: getComputedStyle(document.documentElement).getPropertyValue("--app-forest").trim() || "#2d5016",
                       weight: 4, opacity: 0.9 }).addTo(map);
      bounds = bounds.concat(ll);
    }
    D.walk.stops.forEach(function (st) {
      var icon = L.divIcon({ className: "", iconSize: [26, 26], html: '<div class="stop-pin">' + st.n + "</div>" });
      var m = L.marker([st.lat, st.lng], { icon: icon, title: "Stop " + st.n })
        .addTo(map)
        .bindPopup('<div class="stop-head"><span class="walk-stop-num">' + st.n + "</span>Stop " + st.n + "</div>" +
                   st.species.map(function (id) { return stopSpecies(byId[id]); }).join(""), { maxWidth: 290 });
      markers[st.n] = m;
      bounds.push([st.lat, st.lng]);
    });
    if (bounds.length) map.fitBounds(bounds, { padding: [20, 20] });
  } else {
    document.getElementById("map").innerHTML = '<p class="subtitle" style="padding:12px">Map could not load (offline?).</p>';
  }
  stopsEl.addEventListener("click", function (e) {
    var h = e.target.closest(".stop-head[data-stop]");
    if (!h || !map) return;
    var m = markers[h.getAttribute("data-stop")];
    document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "center" });
    map.setView(m.getLatLng(), Math.max(map.getZoom(), 16));
    m.openPopup();
  });

  // ── plants: the app's species cards; tap → preview panel ──
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var recipeBySpecies = {};
  D.recipes.forEach(function (r) { recipeBySpecies[r.species_id] = r; });
  function filterGroup(s) {
    var k = s.badge.kind;
    return (k === "toxic" || k === "deadly") ? "toxic" : (k === "edible" || k === "caution") ? k : "other";
  }
  var grid = document.getElementById("species-grid");
  grid.innerHTML = D.species.map(function (s) {
    return '<article class="species-card pick' + (s.toxic ? " toxic" : "") + '" role="button" tabindex="0"' +
      ' data-sid="' + s.id + '" data-group="' + filterGroup(s) + '" aria-label="' + esc(s.en || s.sci) + '">' +
      (s.thumb ? '<img class="photo" src="' + esc(s.thumb) + '" alt="" loading="lazy">' : '<div class="photo"></div>') +
      '<div class="body"><div class="common">' + (s.toxic ? "☠ " : "") + esc(s.en || s.sci) + "</div>" +
      (s.de ? '<div class="common-de">' + esc(s.de) + "</div>" : "") +
      '<div class="sci-name">' + esc(s.sci) + "</div>" +
      (s.family ? '<div class="family">' + esc(s.family) + "</div>" : "") + badge(s) + "</div></article>";
  }).join("");

  var chips = document.querySelectorAll(".chip");
  Array.prototype.forEach.call(chips, function (c) {
    c.addEventListener("click", function () {
      var f = c.getAttribute("data-filter");
      Array.prototype.forEach.call(chips, function (x) { x.setAttribute("aria-pressed", x === c ? "true" : "false"); });
      Array.prototype.forEach.call(grid.children, function (card) {
        card.hidden = !(f === "all" || card.getAttribute("data-group") === f);
      });
    });
  });

  var panel = document.getElementById("sp-panel"), scrim = document.getElementById("sp-scrim");
  var panelBody = document.getElementById("sp-panel-body"), lastFocus = null;
  function openPanel(sid) {
    var s = byId[sid]; if (!s) return;
    var photos = (s.photo ? [{ photo: s.photo, thumb: s.thumb }] : []).concat(s.extra || []);
    var r = recipeBySpecies[s.id];
    var w = "";
    if (s.safety.toxic) w += '<div class="warn toxic"><strong>☠ Not safe to eat</strong>' + esc(s.safety.toxic) + "</div>";
    if (s.safety.look_alike) w += '<div class="warn lookalike"><strong>Look-alikes</strong>' + esc(s.safety.look_alike) + "</div>";
    panelBody.innerHTML =
      (photos.length ? '<img class="sp-main" id="sp-main" src="' + esc(photos[0].photo) + '" data-full="' + esc(photos[0].photo) + '" alt="' + esc(s.en || s.sci) + '">' : "") +
      (photos.length > 1 ? '<div class="sp-thumbs">' + photos.map(function (p, i) {
        return '<button class="sp-thumb' + (i === 0 ? " on" : "") + '" data-photo="' + esc(p.photo) + '" aria-label="Photo ' + (i + 1) + '">' +
               '<img src="' + esc(p.thumb) + '" alt=""></button>';
      }).join("") + "</div>" : "") +
      '<div class="sp-text species-card">' +
      '<div class="common" id="sp-panel-title">' + (s.toxic ? "☠ " : "") + esc(s.en || s.sci) + "</div>" +
      (s.de ? '<div class="common-de">' + esc(s.de) + "</div>" : "") +
      '<div class="sci-name">' + esc(s.sci) + "</div>" +
      (s.family ? '<div class="family">' + esc(s.family) + "</div>" : "") +
      (s.months && s.months.length ? '<div class="family">Seen on this walk: ' + s.months.map(function (m) { return MONTHS[m - 1]; }).join(", ") + "</div>" : "") +
      badge(s) +
      (r ? '<div class="walk-stop-recipe"><strong>' + esc(r.dish) + '</strong><div class="line">' + esc(r.line) + "</div></div>" : "") +
      w + "</div>";
    lastFocus = document.activeElement;
    panel.hidden = false; scrim.hidden = false;
    document.body.classList.add("sp-open");
    document.getElementById("sp-close").focus();
  }
  function closePanel() {
    panel.hidden = true; scrim.hidden = true;
    document.body.classList.remove("sp-open");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  grid.addEventListener("click", function (e) {
    var card = e.target.closest(".species-card.pick");
    if (card) openPanel(+card.getAttribute("data-sid"));
  });
  grid.addEventListener("keydown", function (e) {
    var card = e.target.closest(".species-card.pick");
    if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openPanel(+card.getAttribute("data-sid")); }
  });
  panelBody.addEventListener("click", function (e) {
    var b = e.target.closest(".sp-thumb");
    if (!b) return;
    var main = document.getElementById("sp-main");
    main.src = b.getAttribute("data-photo"); main.setAttribute("data-full", b.getAttribute("data-photo"));
    Array.prototype.forEach.call(panelBody.querySelectorAll(".sp-thumb"), function (x) { x.classList.toggle("on", x === b); });
  });
  document.getElementById("sp-close").addEventListener("click", closePanel);
  scrim.addEventListener("click", closePanel);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !panel.hidden && !document.getElementById("lightbox").classList.contains("open")) closePanel();
  });

  // ── recipes: teaser in the app's walk-panel recipe strip ──
  var rg = document.getElementById("recipe-grid");
  rg.innerHTML = D.recipes.length ? D.recipes.map(function (r) {
    var s = byId[r.species_id];
    return '<article class="species-card">' +
      (s.photo ? '<img class="photo" src="' + esc(s.thumb) + '" data-full="' + esc(s.photo) + '" alt="' + esc(s.en || s.sci) + '" loading="lazy">' : "") +
      '<div class="body"><div class="common">' + esc(s.en || s.sci) + "</div>" +
      (s.de ? '<div class="common-de">' + esc(s.de) + "</div>" : "") + badge(s) +
      '<div class="walk-stop-recipe"><strong>' + esc(r.dish) + '</strong><div class="line">' + esc(r.line) + "</div></div>" +
      "</div></article>";
  }).join("") : '<p class="subtitle">Recipes to follow.</p>';

  // ── footer ──
  document.getElementById("disclaimer-h").textContent = D.disclaimer.heading;
  document.getElementById("disclaimer").innerHTML = D.disclaimer.paras.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
  document.getElementById("footer-links").innerHTML =
    '<a href="' + esc(D.contact_url) + '" target="_top" rel="noopener">Contact</a>' +
    (D.impressum_url ? '<a href="' + esc(D.impressum_url) + '" target="_top" rel="noopener">Impressum</a>'
                     : '<span class="placeholder">Impressum (link to follow)</span>');

  // ── photo lightbox ──
  var lb = document.getElementById("lightbox");
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t.matches && t.matches("img[data-full]")) { lb.querySelector("img").src = t.getAttribute("data-full"); lb.classList.add("open"); }
    else if (t === lb || t.parentNode === lb) { lb.classList.remove("open"); }
  });

  show((location.hash || "#walk").slice(1));
})();
</script>
