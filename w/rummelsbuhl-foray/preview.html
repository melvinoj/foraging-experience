<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Rümmelsbühl foray</title>
<style>
/* ════ App styles — copied from the app at build time (app_styles.py) ════ */
/* ── frontend/static/css/tokens.css :root (verbatim) ── */
:root {
  /* Colour */
  --ink:         #1E2A22;
  --ground:      #EEF0EA;
  --paper:       #FDFDFB;
  --moss:        #5A6B58;
  --moss-light:  #8A9884;
  --leaf:        #7E9471;
  --leaf-pale:   #C9D2BC;
  --hairline:    #D8DCD2;
  --damson:      #5B3A4E;
  --amber:       #C89B3C;
  --water:       #6E8FA8;
  --alert:       #B0524A;

  /* Type */
  --font-display: Georgia, 'Times New Roman', serif;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

  /* Layout */
  --touch-min: 44px;
}
/* ── app shell colours: species.html body {'background': '#2a3330', 'color': '#d8e4d8'}, lists.html body {'background': '#1e2b28', 'color': '#d8e4d8'} ── */
:root { --app-shell:#2a3330; --app-shell-deep:#1e2b28; --app-text:#d8e4d8; --app-toxic:#dc2626; --app-forest:#2d5016; --app-heading:#8ab87a; }
/* index.html */
.walk-stop-card {
      background: #f8fdf4; border: 1px solid #d8e8c8;
      border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    }
/* index.html */
.walk-stop-num {
      display: inline-block; min-width: 22px; height: 22px; padding: 0 4px; box-sizing: border-box;
      background: #2d5016; color: white; border-radius: 11px;   /* pill: fits "12a" */
      font-size: 0.7rem; font-weight: 700;
      text-align: center; line-height: 22px;
      margin-right: 7px; flex-shrink: 0; vertical-align: middle;
    }
/* index.html */
.walk-stop-species { font-size: 0.82rem; font-weight: 600; color: #2d5016; }
/* index.html */
.walk-stop-common  { font-size: 0.75rem; color: #666; margin-top: 2px; }
/* index.html */
.walk-stop-meta    { font-size: 0.72rem; color: #999; margin-top: 2px; }
/* index.html */
.walk-stop-recipe  {
      margin-top: 6px; padding: 5px 8px;
      background: #fffbe6; border-left: 3px solid #e5a800;
      border-radius: 0 4px 4px 0; font-size: 0.73rem; color: #6b5200;
    }
/* index.html */
.walk-stop-recipe strong { color: #e5a800; }
/* index.html */
.walk-header h3 { font-size: 0.9rem; color: #2d5016; margin-bottom: 2px; }
/* index.html */
.walk-header .walk-sub { font-size: 0.75rem; color: #888; }
/* species.html */
.species-card {
      background: #344440; border: 1px solid #4a5e5a; border-radius: 8px;
      padding: 14px; cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s;
      text-decoration: none; color: inherit; display: block;
    }
/* species.html */
.species-card .common { font-size: 0.95rem; font-weight: 700; color: #a8c88a; margin-bottom: 2px; }
/* species.html */
.species-card .sci-name { font-size: 0.78rem; font-weight: 400; font-style: italic; color: #5a7a3a; }
/* species.html */
.species-card .common-de { font-size: 0.75rem; color: #7a6530; font-style: italic; margin-top: 1px; }
/* species.html */
.species-card .family { font-size: 0.75rem; color: #888; margin-top: 4px; }
/* species.html */
.species-card .warn-badge {
      display: inline-block; margin-top: 6px; margin-left: 4px;
      background: #f8d7da; color: #842029; font-size: 0.72rem;
      padding: 2px 7px; border-radius: 10px;
    }
/* species.html */
.species-card .toxic-badge {
      display: inline-block; margin-top: 6px; margin-left: 4px;
      background: #dc2626; color: #fff; font-size: 0.72rem;
      padding: 2px 7px; border-radius: 10px; font-weight: 600;
    }
/* species.html */
#list-view h2 { font-size: 1.3rem; color: #8ab87a; margin-bottom: 4px; }
/* species.html */
#list-view .subtitle { font-size: 0.85rem; color: #7a9a7a; margin-bottom: 16px; }

/* Edibility badges — colours read from index.html renderWalkPanel() at build time */
.badge { display:inline-block; font-size:0.68rem; padding:1px 6px; border-radius:4px;
  font-weight:600; background:#f3f3f3; color:#555; }
.badge.toxic, .badge.deadly { background:#dc2626; color:#fff; font-weight:700; }
.badge.edible   { background:#d1f5da; color:#166534; }
.badge.inedible { background:#fef3c7; color:#854d0e; }
/* Apiaceae ID card + "toxicity unknown" (fail closed): species.html .warn-badge colours */
.badge.apiaceae, .badge.unknown { background:#f8d7da; color:#842029; font-weight:700; }
/* caution: the walk panel has no caution colour — use the app's --amber token */
.badge.caution  { background:var(--amber); color:var(--ink); }


/* ════ Embed card: fixed 500px, no scrolling, no JavaScript ════
   Not one big link: photo+title and the button are links (target=_top); the
   recipe teasers are plain text; the "More walks" row sits outside any link.
   Height budget (1rem = 16px, line-heights fixed below so the sum is exact):
     border 2 + photo 200 + button 60 (44 min-height + 16 margin)
     + More walks row 23 (11.52px × 1.3 + 8 padding; row absent when empty)
     = 285, leaving 215px for the body (238 without More walks).
     Body needs: padding 24 + max(left 155 = route 112 + 8 + stats 2 lines 35,
                                  right 161 = h2 24 + 3 teasers 116 + note 21) = 185px.
     Slack: 30px with More walks, 53px without. Narrow (≤400px): photo 180, 2 teasers.
   Dish names are always one line (ellipsis), so a long dish cannot push the card. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 500px; overflow: hidden; background: var(--app-shell-deep); }
  body { font-family: var(--font-ui); color: var(--app-text); }
  .card { display: grid; grid-template-rows: 200px minmax(0, 1fr) auto auto; height: 500px; overflow: hidden;
    line-height: 1.3; background: var(--app-shell); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; }
  .card a:focus-visible { outline: 3px solid var(--leaf); outline-offset: -3px; }

  .hero { position: relative; display: block; overflow: hidden; background: var(--app-shell-deep);
    color: inherit; text-decoration: none; }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(30,43,40,.95) 0%, rgba(30,43,40,.35) 55%, rgba(30,43,40,0) 100%); }
  .hero-text { position: absolute; left: 16px; right: 16px; bottom: 12px; z-index: 1; }
  .hero h1 { margin: 0; font: 400 1.45rem/1.15 var(--font-display); color: var(--paper);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hero .where { margin-top: 4px; font-size: .78rem; color: var(--leaf-pale);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .body { display: grid; grid-template-columns: 112px 1fr; gap: 14px; padding: 14px 16px 10px; min-height: 0; overflow: hidden; }
  .route { width: 112px; height: 112px; border-radius: 8px; background: var(--app-shell-deep);
    border: 1px solid rgba(255,255,255,.08); display: block; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 8px; font-size: .74rem; color: var(--moss-light); }
  .stats b { color: var(--app-heading); font-weight: 700; }
  .side { min-width: 0; overflow: hidden; }
  .side h2 { margin: 0 0 6px; font: 400 .95rem/1.2 var(--font-display); color: var(--app-heading); }
  .teasers { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .teasers li { border-left: 3px solid var(--amber); padding: 1px 0 1px 8px; min-width: 0; }
  .dish { font-size: .82rem; font-weight: 600; color: var(--paper);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plant { font-size: .72rem; color: var(--moss-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { margin-top: 6px; font-size: .72rem; color: var(--leaf-pale); }

  .more-walks { padding: 4px 16px; font-size: .72rem; color: var(--moss-light);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more-walks a { color: var(--leaf-pale); }

  .go { margin: 0 16px 16px; min-height: var(--touch-min); display: flex; align-items: center; justify-content: center;
    background: var(--app-forest); color: var(--paper); border: 1.5px solid var(--leaf); border-radius: 7px;
    font-weight: 600; font-size: .95rem; text-decoration: none; }
  .go:hover { background: var(--moss); }

  /* Narrow embeds (phones): smaller photo and route, two teasers */
  @media (max-width: 400px) {
    .card { grid-template-rows: 180px minmax(0, 1fr) auto auto; }
    .body { grid-template-columns: 84px 1fr; gap: 12px; }
    .route { width: 84px; height: 84px; }
    .teasers li:nth-child(3) { display: none; }
  }
</style>
</head>
