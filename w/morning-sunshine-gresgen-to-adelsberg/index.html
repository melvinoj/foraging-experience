": 1, "extra": [], "months": [5]}, {"id": 9, "sci": "Daucus carota", "en": "Wild Carrot", "de": "Gewöhnliche Möhre", "family": "Apiaceae", "kingdom": "Plantae", "toxic": false, "deadly": false, "apiaceae": true, "badge": {"kind": "apiaceae", "text": "Carrot family — deadly look-alikes"}, "safety": {"look_alike": "Hemlock (Conium maculatum) is deadly and shares wild carrot's ground. The flowers are the clearest tell — wild carrot's flat white umbel often carries a single dark floret at its heart. Hemlock's stem is smooth and round with purple blotches; wild carrot's is ridged and bristly. Never harvest any Apiaceae without positive identification of all distinguishing features. If in doubt, do not harvest."}, "photo": "photos/9.jpg", "thumb": "photos/9_t.jpg", "n_obs": 1, "extra": [], "months": [5]}, {"id": 186, "sci": "Thymus pulegioides", "en": "Large thyme", "de": "Arzneithymian", "family": "Lamiaceae", "kingdom": "Plantae", "toxic": false, "deadly": false, "apiaceae": false, "badge": {"kind": "edible", "text": "Edible"}, "safety": {}, "photo": "photos/186.jpg", "thumb": "photos/186_t.jpg", "n_obs": 6, "extra": [{"photo": "photos/186_1.jpg", "thumb": "photos/186_1_t.jpg"}, {"photo": "photos/186_2.jpg", "thumb": "photos/186_2_t.jpg"}, {"photo": "photos/186_3.jpg", "thumb": "photos/186_3_t.jpg"}], "months": [5, 6, 7, 10]}, {"id": 98, "sci": "Artemisia vulgaris", "en": "Mugwort", "de": "Gemeiner Beifuss", "family": "Asteraceae", "kingdom": "Plantae", "toxic": false, "deadly": false, "apiaceae": false, "badge": {"kind": "caution", "text": "⚠ caution — warning not yet reviewed"}, "safety": {"look_alike": "Can be confused with monkshood (Aconitum napellus) before flowering — monkshood is deadly. Check the leaf underside to distinguish: mugwort has a dense, silvery-white hairy underside; monkshood is smooth and green."}, "photo": "photos/98.jpg", "thumb": "photos/98_t.jpg", "n_obs": 1, "extra": [], "months": [5]}, {"id": 345, "sci": "Alchemilla vulgaris", "en": "Lady's-m ic — do not eat"}, "safety": {"toxic": "Butterbur (Petasites species) is edible, but only specific parts of the plant and only after proper preparation. Raw butterbur and unboiled parts are toxic because they contain naturally occurring pyrrolizidine alkaloids (PAs) that can cause severe liver damage.Safe Edible Parts & PreparationFukinoto (Flower Buds): The aromatic, unopened flower buds that appear in early spring are a prized delicacy (popular in Japanese cuisine). They must be boiled and blanched to remove their harsh bitterness before being fried into tempura or chopped into fuki-miso.Stalks (Fuki): Young, pale green stalks can be peeled, thoroughly boiled, and soaked to remove toxins. They are then typically braised, stewed, or pickled.Leaves: Generally, the leaves are considered too tough and fibrous to eat. Young leaves can occasionally be consumed, but only if parboiled and soaked to leach out the PAs."}, "photo": "photos/19.jpg", "thumb": "photos/19_t.jpg", "n_obs": 1, "extra": [], "months": [5]}, {"id": 230, "sci": "Aquilegia vulgaris", "en": "Columbine", "de": "Gemeine Akelei", "family": "Ranunculaceae", "kingdom": "Plantae", "toxic": true, "deadly": false, "apiaceae": false, "badge": {"kind": "toxic", "text": "☠ Toxic — do not eat"}, "safety": {"toxic": "Not safe to eat. Please simply appreciate the natural beauty and power of this plant without handling or consuming it."}, "photo": "photos/230.jpg", "thumb": "photos/230_t.jpg", "n_obs": 1, "extra": [], "months": [5]}, {"id": 16, "sci": "Stellaria media", "en": "Common chickweed", "de": "Vogelmiere", "family": "Caryophyllaceae", "kingdom": "Plantae", "toxic": false, "deadly": false, "apiaceae": false, "badge": {"kind": "edible", "text": "Edible"}, "safety": {}, "photo": "photos/16.jpg", "thumb": "photos/16_t.jpg", "n_obs": 1, "extra": [], "months": [10]}, {"id": 93, "sci": "Urtica dioica", "en": "Stinging nettle", "de": "Grosse Brennessel", "family": "Urticaceae", "kingdom": "Plantae", "toxic": false, "  a genuine bitterness and a faint herbal pungency that lands somewhere between wild rocket and…", "source": "ai_generated", "warnings": []}, {"recipe_id": 179, "species_id": 216, "dish": "Ox-Eye Daisy Buds in Brown Butter, with Fermented Honey and Sea Aster", "line": "Leucanthemum ircutianum – ox-eye daisy – has a bite that people don’t expect.", "source": "ai_generated", "warnings": []}, {"recipe_id": 237, "species_id": 217, "dish": "Ragged Robin on Toast", "line": "The nodding catchfly has been overlooked by most modern cooks, but it carries a quiet, grassy vitality that works beautifully when treated simply.", "source": "ai_generated", "warnings": []}, {"recipe_id": 245, "species_id": 233, "dish": "Braised Cat’s Ear with Saffron, Preserved Lemon, and a Slow Egg", "line": "There’s a moment in late spring when the lawns get shaggy and the cat’s ear comes into its own.", "source": "ai_generated", "warnings": []}, {"recipe_id": 218, "species_id": 273, "dish": "Let’s be straight about this one.", "line": "Let’s be straight about this one.", "source": "ai_generated", "warnings": []}, {"recipe_id": 74, "species_id": 329, "dish": "Spring Beech Leaf Salad with Toasted Beechnut, Aged Sheep's Cheese & Wild Herb Dressing", "line": "There's a window of maybe three weeks in spring when beech does something quietly extraordinary — those translucent copper-green leaves unfurl with a softness and a delicate nuttiness…", "source": "ai_generated", "warnings": []}, {"recipe_id": 83, "species_id": 341, "dish": "Malva moschata with Labneh, Preserved Lemon & Toasted Seed", "line": "Musk mallow doesn't shout.", "source": "ai_generated", "warnings": []}, {"recipe_id": 258, "species_id": 355, "dish": "Always cook well; some people react, so try a little first.", "line": "Always cook well; some people react, so try a little first.", "source": "ai_generated", "warnings": [{"kind": "preparation", "heading": "Caution", "text": "Always cook well; some people react, so try a little first. Avoid de to this humble tree in the form of a refreshing sorbet, accompanied by saffron-kissed pears and a whisper of anise.", "source": "ai_generated", "warnings": []}, {"recipe_id": 125, "species_id": 486, "dish": "Sycamore Leaf-Wrapped Roots, with Pickled Seed Keys and a Warm Sap & Honey Glaze", "line": "Acer pseudoplatanus gets a bad name in some circles—invasive, they say, or too common to be loved.", "source": "ai_generated", "warnings": []}, {"recipe_id": 203, "species_id": 587, "dish": "Crab Apple and Rose Geranium Jelly with Sea Aster Salt", "line": "I've got a deep respect for the crab apple.", "source": "ai_generated", "warnings": []}, {"recipe_id": 204, "species_id": 591, "dish": "Yellow Loosestrife & Caramelised Onion Tart with Wild Herb Pastry", "line": "There's a particular quietness to cooking with plants that most people walk past.", "source": "ai_generated", "warnings": []}], "disclaimer": {"heading": "A note on safety and sources", "paras": ["Edibility and medicinal information on this page is for educational reference only. Always verify identification with multiple authoritative sources before consuming any wild plant or fungi. Never rely on any single source, including this page, as your sole basis for a consumption decision. Identification and content may be AI-assisted. Human-created and/or reviewed content is indicated where shown. This page is an educational resource, not a safety-certified identification system."]}};

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script>
(function () {
  "use strict";
  var D = window.DATA;
  var byId = {};
  D.species.forEach(function (s) { byId[s.id] = s; });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function badge(s) { return '<span class="badge ' + esc(s.badge.kind) + '">' + esc(s.badge.text) + "</span>"; }
  // Cautionary text that travels with a recipe (Fix B, 22 Oct 2026; export.py
  // recipe "warnings" = culinary_warnings: look-alike + preparation, curator
  // text, uncut). Used where no species warning block sits beside the recipe.
  function recipeWarn(r) {
    return (r && r.warnings || []).map(function (w) {
      return '<div class="warn ' + (w.kind === "look_alike" ? "lookalike" : "caution") + ' culinary-warning"><strong>⚠ ' +
        esc(w.heading) + "</strong>" + esc(w.text) + "</div>";
    }).join("");
  }
  function img(src, alt) {
    return src ? '<img src="' + esc(src) + '" alt="' + esc(alt) + '" loading="lazy">' : '<div class="noimg"></div>';
  }
  // Same order as the app's walk panel: scientific name, common name, then the badge.
  function stopSpecies(s) {
    var common = [s.en, s.de].filter(Boolean).join(" · ");
    return '<div class="walk-stop-sp">' + img(s.thumb, s.en || s.sci) + "<div>" +
      '<span class="walk-stop-species">' + esc(s.sci) + "</span>" +
      (common ? '<div class="walk-stop-common">' + esc(common) + "</div>" : "") +
      '<div class="walk-stop-meta">' + badge(s) + "</div></div></div>";
  }
  // Species already shown at an earlier stop: one compact line, safety badge
  // kept (rp.badge is set by gates.repeat_line_badge), no photo or recipe.
  // Names rule (as the app's static/js/species-names.js): "Common (Latin)",
  // Latin in italics; Latin alone only when there is no common name.
  function spName(s) {
    var latin = '<span class="walk-stop-species">' + esc(s.sci) + "</span>";
    return s.en ? esc(s.en) + " (" + latin + ")" : latin;
  }
  function alsoHere(s, rp) {
    return '<div class="walk-stop-also">Also here: ' + (rp.badge ? badge({ badge: rp.badge }) + " " : "") +
      spName(s) + " — see stop " + esc(rp.first) + "</div>";
  }
  function stopBody(st) {
    var full = st.species.filter(function (id) { return !st.repeat[id]; });
    var rep  = st.species.filter(function (id) { return st.repeat[id]; });
    return full.map(function (id) { return stopSpecies(byId[id]); }).join("") +
      rep.map(function (id) { return alsoHere(byId[id], st.repeat[id]); }).join("");
  }

  // ── header ──
  document.title = D.title;
  document.getElementById("title").textContent = D.title;
  document.getElementById("intro").textContent = D.intro;
  // German / place lines: shown only when the curator filled them in (never machine-translated).
  [["title-de", D.title_de], ["intro-de", D.intro_de], ["where", D.where], ["where-de", D.where_de]].forEach(function (p) {
    var el = document.getElementById(p[0]);
    if (p[1]) { el.textContent = p[1]; el.hidden = false; }
  });
  var km = D.walk.distance_m ? (D.walk.distance_m / 1000).toFixed(1) + " km" : "";
  var hrs = D.walk.duration_min ? "about " + (Math.round(D.walk.duration_min / 30) / 2) + " h walking" : "";
  document.getElementById("meta").textContent =
    [km, hrs, D.walk.stops.length + " stops", D.species.length + " species"].filter(Boolean).join(" · ");
  var cta = document.getElementById("cta");
  cta.textContent = D.cta_label; cta.href = D.contact_url;

  // ── tabs ──
  var tabs = ["walk", "plants", "recipes", "taxonomy"];
  var treeLoaded = false, map = null;
  function show(name) {
    if (tabs.indexOf(name) < 0) name = "walk";
    tabs.forEach(function (t) {
      document.getElementById("tab-" + t).setAttribute("aria-selected", t === name ? "true" : "false");
      document.getElementById("panel-" + t).hidden = t !== name;
    });
    if (name === "taxonomy" && !treeLoaded) {
      // Created on first open so the tree lays out at its real size.
      var f = document.createElement("iframe");
      f.src = "tree.html"; f.title = "Plant family tree";
      document.getElementById("tree-frame-wrap").appendChild(f);
      treeLoaded = true;
    }
    if (name === "walk" && map) setTimeout(function () { map.invalidateSize(); }, 0);
    if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  }
  tabs.forEach(function (t) {
    document.getElementById("tab-" + t).addEventListener("click", function () { show(t); });
  });

  // ── walk: stop cards in the app's walk-panel layout ──
  var stopsEl = document.getElementById("stops");
  stopsEl.innerHTML = D.walk.stops.map(function (st) {
    // Plain numbered stop; toxicity is shown only on the plant (its badge).
    return '<div class="walk-stop-card" id="stop-' + st.n + '">' +
      '<div class="stop-head" data-stop="' + st.n + '"><span class="walk-stop-num">' + st.n + "</span>" +
      (st.species.length > 1 ? st.species.length + " species here" : "Stop " + st.n) + "</div>" +
      stopBody(st) + "</div>";
  }).join("");

  var markers = {};
  if (window.L) {
    map = L.map("map", { scrollWheelZoom: false });
    // Same keyless base layers as the app (frontend/index.html _baseLayers). No API keys.
    var base = {
      "Standard": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '© <a href="https://openstreetmap.org/copyright" target="_top">OpenStreetMap</a> contributors', maxZoom: 19 }),
      "Satellite": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Tiles &copy; Esri &mdash; Source: Esri, USGS, AeroGRID, IGN, and the GIS User Community", maxZoom: 19 }),
      "Topo": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
        attribution: 'Map data: &copy; <a href="https://openstreetmap.org/copyright" target="_top">OpenStreetMap</a> contributors, SRTM | Display: &copy; <a href="https://opentopomap.org" target="_top">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_top">CC-BY-SA</a>)',
        maxZoom: 17, subdomains: ["a", "b", "c"] })
    };
    base["Standard"].addTo(map);
    L.control.layers(base, null, { position: "topright", collapsed: true }).addTo(map);

    // Locate me — browser geolocation, shown on the map only. Nothing is stored or sent.
    var here = null;
    var Locate = L.Control.extend({
      options: { position: "topleft" },
      onAdd: function () {
        var b = L.DomUtil.create("button", "locate-btn");
        b.type = "button"; b.title = "Show my location"; b.setAttribute("aria-label", "Show my location");
        b.textContent = "◎";
        L.DomEvent.disableClickPropagation(b);
        L.DomEvent.on(b, "click", function () {
          if (!navigator.geolocation) { alert("Location isn't available in this browser."); return; }
          b.disabled = true;
          navigator.geolocation.getCurrentPosition(function (pos) {
            b.disabled = false;
            var ll = [pos.coords.latitude, pos.coords.longitude];
            if (here) here.remove();
            here = L.layerGroup([
              L.circle(ll, { radius: pos.coords.accuracy, color: "#6E8FA8", weight: 1, fillOpacity: 0.12 }),
              L.circleMarker(ll, { radius: 7, color: "#fff", weight: 2, fillColor: "#6E8FA8", fillOpacity: 1 })
            ]).addTo(map);
            map.setView(ll, Math.max(map.getZoom(), 15));
          }, function (err) {
            b.disabled = false;
            alert(err.code === 1 ? "Location permission was refused." : "Couldn't get your location.");
          }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
        });
        return b;
      }
    });
    map.addControl(new Locate());
    var bounds = [];
    if (D.walk.line) {
      var ll = D.walk.line.map(function (c) { return [c[1], c[0]]; });
      var lineColour = getComputedStyle(document.documentElement).getPropertyValue("--app-forest").trim() || "#2d5016";
      // As the app (frontend/index.html): routed parts solid; straight legs
      // between stops (D.walk.straight_ranges, vertex ranges) dashed with a tooltip.
      var at = 0;
      function solid(a, b) {
        if (b > a) L.polyline(ll.slice(a, b + 1), { color: lineColour, weight: 4, opacity: 0.9 }).addTo(map);
      }
      (D.walk.straight_ranges || []).forEach(function (r) {
        solid(at, r[0]);
        L.polyline(ll.slice(r[0], r[1] + 1), { color: lineColour, weight: 3.5, dashArray: "7 6", opacity: 0.9 })
          .bindTooltip("Straight line between stops — no mapped footpath here", { sticky: true })
          .addTo(map);
        at = r[1];
      });
      solid(at, ll.length - 1);
      bounds = bounds.concat(ll);
    }
    D.walk.stops.forEach(function (st) {
      var icon = L.divIcon({ className: "", iconSize: [26, 26], html: '<div class="stop-pin">' + st.n + "</div>" });
      var m = L.marker([st.lat, st.lng], { icon: icon, title: "Stop " + st.n })
        .addTo(map)
        .bindPopup('<div class="stop-head"><span class="walk-stop-num">' + st.n + "</span>Stop " + st.n + "</div>" +
                   stopBody(st), { maxWidth: 290 });
      markers[st.n] = m;
      bounds.push([st.lat, st.lng]);
    });
    if (bounds.length) map.fitBounds(bounds, { padding: [20, 20] });
  } else {
    document.getElementById("map").innerHTML = '<p class="subtitle" style="padding:12px">Map could not load (offline?).</p>';
  }
  stopsEl.addEventListener("click", function (e) {
    var h = e.target.closest(".stop-head[data-stop]");
    if (!h || !map) return;
    var m = markers[h.getAttribute("data-stop")];
    document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "center" });
    map.setView(m.getLatLng(), Math.max(map.getZoom(), 16));
    m.openPopup();
  });

  // ── plants: the app's species cards; tap → preview panel ──
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var recipeBySpecies = {};
  D.recipes.forEach(function (r) { recipeBySpecies[r.species_id] = r; });
  function filterGroup(s) {
    var k = s.badge.kind;
    return (k === "toxic" || k === "deadly") ? "toxic" : (k === "edible" || k === "caution") ? k : "other";
  }
  var grid = document.getElementById("species-grid");
  grid.innerHTML = D.species.map(function (s) {
    return '<article class="species-card pick' + (s.toxic ? " toxic" : "") + '" role="button" tabindex="0"' +
      ' data-sid="' + s.id + '" data-group="' + filterGroup(s) + '" aria-label="' + esc(s.en || s.sci) + '">' +
      (s.thumb ? '<img class="photo" src="' + esc(s.thumb) + '" alt="" loading="lazy">' : '<div class="photo"></div>') +
      '<div class="body"><div class="common">' + (s.toxic ? "☠ " : "") + esc(s.en || s.sci) + "</div>" +
      (s.de ? '<div class="common-de">' + esc(s.de) + "</div>" : "") +
      '<div class="sci-name">' + esc(s.sci) + "</div>" +
      (s.family ? '<div class="family">' + esc(s.family) + "</div>" : "") + badge(s) + "</div></article>";
  }).join("");

  var chips = document.querySelectorAll(".chip");
  Array.prototype.forEach.call(chips, function (c) {
    c.addEventListener("click", function () {
      var f = c.getAttribute("data-filter");
      Array.prototype.forEach.call(chips, function (x) { x.setAttribute("aria-pressed", x === c ? "true" : "false"); });
      Array.prototype.forEach.call(grid.children, function (card) {
        card.hidden = !(f === "all" || card.getAttribute("data-group") === f);
      });
    });
  });

  var panel = document.getElementById("sp-panel"), scrim = document.getElementById("sp-scrim");
  var panelBody = document.getElementById("sp-panel-body"), lastFocus = null;
  function openPanel(sid) {
    var s = byId[sid]; if (!s) return;
    var photos = (s.photo ? [{ photo: s.photo, thumb: s.thumb }] : []).concat(s.extra || []);
    var r = recipeBySpecies[s.id];
    var w = "";
    if (s.safety.toxic) w += '<div class="warn toxic"><strong>☠ Not safe to eat</strong>' + esc(s.safety.toxic) + "</div>";
    if (s.safety.caution) w += '<div class="warn caution"><strong>⚠ Caution</strong>' + esc(s.safety.caution) + "</div>";
    if (s.safety.preparation) w += '<div class="warn caution"><strong>⚠ Preparation</strong>' + esc(s.safety.preparation) + "</div>";
    if (s.safety.look_alike) w += '<div class="warn lookalike"><strong>Look-alikes</strong>' + esc(s.safety.look_alike) + "</div>";
    panelBody.innerHTML =
      (photos.length ? '<img class="sp-main" id="sp-main" src="' + esc(photos[0].photo) + '" data-full="' + esc(photos[0].photo) + '" alt="' + esc(s.en || s.sci) + '">' : "") +
      (photos.length > 1 ? '<div class="sp-thumbs">' + photos.map(function (p, i) {
        return '<button class="sp-thumb' + (i === 0 ? " on" : "") + '" data-photo="' + esc(p.photo) + '" aria-label="Photo ' + (i + 1) + '">' +
               '<img src="' + esc(p.thumb) + '" alt=""></button>';
      }).join("") + "</div>" : "") +
      '<div class="sp-text species-card">' +
      '<div class="common" id="sp-panel-title">' + (s.toxic ? "☠ " : "") + esc(s.en || s.sci) + "</div>" +
      (s.de ? '<div class="common-de">' + esc(s.de) + "</div>" : "") +
      '<div class="sci-name">' + esc(s.sci) + "</div>" +
      (s.family ? '<div class="family">' + esc(s.family) + "</div>" : "") +
      (s.months && s.months.length ? '<div class="family">Seen on this walk: ' + s.months.map(function (m) { return MONTHS[m - 1]; }).join(", ") + "</div>" : "") +
      badge(s) +
      // Fix B: the species warnings (w) sit right after the recipe in this panel — not repeated.
      (r ? '<div class="walk-stop-recipe"><strong>' + esc(r.dish) + '</strong><div class="line">' + esc(r.line) + "</div></div>" : "") +
      w + "</div>";
    lastFocus = document.activeElement;
    panel.hidden = false; scrim.hidden = false;
    document.body.classList.add("sp-open");
    document.getElementById("sp-close").focus();
  }
  function closePanel() {
    panel.hidden = true; scrim.hidden = true;
    document.body.classList.remove("sp-open");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  grid.addEventListener("click", function (e) {
    var card = e.target.closest(".species-card.pick");
    if (card) openPanel(+card.getAttribute("data-sid"));
  });
  grid.addEventListener("keydown", function (e) {
    var card = e.target.closest(".species-card.pick");
    if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openPanel(+card.getAttribute("data-sid")); }
  });
  panelBody.addEventListener("click", function (e) {
    var b = e.target.closest(".sp-thumb");
    if (!b) return;
    var main = document.getElementById("sp-main");
    main.src = b.getAttribute("data-photo"); main.setAttribute("data-full", b.getAttribute("data-photo"));
    Array.prototype.forEach.call(panelBody.querySelectorAll(".sp-thumb"), function (x) { x.classList.toggle("on", x === b); });
  });
  document.getElementById("sp-close").addEventListener("click", closePanel);
  scrim.addEventListener("click", closePanel);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !panel.hidden && !document.getElementById("lightbox").classList.contains("open")) closePanel();
  });

  // ── recipes: teaser in the app's walk-panel recipe strip ──
  var rg = document.getElementById("recipe-grid");
  rg.innerHTML = D.recipes.length ? D.recipes.map(function (r) {
    var s = byId[r.species_id];
    return '<article class="species-card">' +
      (s.photo ? '<img class="photo" src="' + esc(s.thumb) + '" data-full="' + esc(s.photo) + '" alt="' + esc(s.en || s.sci) + '" loading="lazy">' : "") +
      '<div class="body"><div class="common">' + esc(s.en || s.sci) + "</div>" +
      (s.de ? '<div class="common-de">' + esc(s.de) + "</div>" : "") + badge(s) +
      '<div class="walk-stop-recipe"><strong>' + esc(r.dish) + '</strong>' + recipeWarn(r) + '<div class="line">' + esc(r.line) + "</div></div>" +
      "</div></article>";
  }).join("") : '<p class="subtitle">Recipes to follow.</p>';

  // ── footer ──
  document.getElementById("disclaimer-h").textContent = D.disclaimer.heading;
  document.getElementById("disclaimer").innerHTML = D.disclaimer.paras.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
  document.getElementById("footer-links").innerHTML =
    '<a href="' + esc(D.contact_url) + '" target="_top" rel="noopener">Contact</a>' +
    (D.impressum_url ? '<a href="' + esc(D.impressum_url) + '" target="_top" rel="noopener">Impressum</a>'
                     : '<span class="placeholder">Impressum (link to follow)</span>') +
    (D.datenschutz_url ? '<a href="' + esc(D.datenschutz_url) + '" target="_top" rel="noopener">Datenschutz</a>'
                       : '<span class="placeholder">Datenschutz (link to follow)</span>');

  // ── photo lightbox ──
  var lb = document.getElementById("lightbox");
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t.matches && t.matches("img[data-full]")) { lb.querySelector("img").src = t.getAttribute("data-full"); lb.classList.add("open"); }
    else if (t === lb || t.parentNode === lb) { lb.classList.remove("open"); }
  });

  show((location.hash || "#walk").slice(1));
})();
</script>
</body>
</html>
